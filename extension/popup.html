<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fairplate</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <span class="mark" aria-hidden="true"></span><b>fairplate</b><span class="ver" id="ver"></span><span class="sp"></span>
  <button class="icon" id="theme" type="button" aria-label="Switch to dark mode">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
  </button>
</header>

<section>
  <div class="label">This tab</div>
  <div class="now" id="now" data-state="idle"><span class="dot" aria-hidden="true"></span><p id="status">Checking this tab…</p></div>
</section>

<section class="stats" id="stats" aria-label="Captured so far"></section>

<section>
  <div class="label">Last captures</div>
  <ol class="recent" id="recent"></ol>
</section>

<footer class="actions">
  <button class="btn hl" id="open" type="button">Open Fairplate<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <button class="btn quiet" id="clear" type="button">Clear captured data</button>
</footer>

<p class="fine"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg><span>Saves the store's details, menu prices, cart items and checkout amounts. Never saves your address, name, email, phone, payment details or order history.</span></p>
<script src="popup.js"></script>
</body>
</html>
